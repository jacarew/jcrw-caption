<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; connect-src 'self' ws:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Jcrw Tizen Alıcısı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <div id="caption" aria-live="polite"></div>
    <section id="setup" class="panel">
      <div class="brand">JCRW <span>TIZEN</span></div>
      <h1>Samsung TV Alıcısı</h1>
      <p class="sub">TV ve tablet aynı Wi‑Fi ağında olmalı.</p>
      <label>Companion tablet IP
        <input id="phoneIp" type="text" inputmode="decimal" placeholder="192.168.1.20" autocomplete="off">
      </label>
      <label>Eşleştirme kodu
        <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="6 haneli kod">
      </label>
      <div class="actions">
        <button id="connect" class="primary">Tablete bağlan</button>
        <button id="showHdmi">HDMI görüntüsünü aç</button>
      </div>
      <p id="status" role="status">Hazır. Tablet uygulamasında Ayarlar → Samsung Tizen TV alıcısını eşleştir.</p>
      <p class="note">Samsung TV, uygulamalar üstünde sistem overlay’i desteklemez. Oyun görüntüsü Tizen PiP penceresinde açılır; altyazı uygulama içinde görüntülenir.</p>
    </section>
    <button id="menuButton" aria-label="Bağlantı ayarları">⚙</button>
    <button id="exitButton">Alıcıyı kapat</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
