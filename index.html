    background-image:linear-gradient(rgba(47,140,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,140,255,.07) 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);
    animation:grid 18s linear infinite}
  @keyframes grid{to{background-position:0 48px,48px 0}}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 14s ease-in-out infinite}
  .o1{width:380px;height:380px;background:var(--blue);left:-90px;top:12%}
  .o2{width:320px;height:320px;background:var(--pink);right:-80px;top:40%;animation-delay:-5s}
  .o3{width:300px;height:300px;background:var(--green);left:35%;bottom:-120px;animation-delay:-9s}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}

  /* ---------- menü ---------- */
  nav{position:sticky;top:0;z-index:50;background:rgba(7,11,22,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;gap:18px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.3px}
  .brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 0 14px rgba(47,140,255,.6)}
  .menu{display:flex;gap:4px;margin-left:auto}
  .menu a{position:relative;text-decoration:none;color:var(--muted);font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:8px;transition:color .2s}
  .menu a::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--cyan),var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .3s}
  .menu a:hover,.menu a.on{color:#fff}
  .menu a:hover::after,.menu a.on::after{transform:scaleX(1)}
  .lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;position:relative}
  .lang button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;transition:color .25s}
  .lang button.on{color:#fff}
  .lang i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--cyan));
    transition:transform .3s cubic-bezier(.5,1.6,.5,1);box-shadow:0 0 14px rgba(47,140,255,.7)}
  .lang[data-l="en"] i{transform:translateX(100%)}
  .burger{display:none;background:none;border:1px solid var(--line);color:#fff;border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer}
  @media(max-width:860px){
    .burger{display:block;margin-left:auto}
    .menu{position:absolute;left:0;right:0;top:62px;flex-direction:column;background:#070b16;border-bottom:1px solid var(--line);
      padding:10px 16px;margin:0;max-height:0;overflow:hidden;opacity:0;transition:.35s;pointer-events:none}
    .menu.open{max-height:480px;opacity:1;pointer-events:auto}
    .menu a{padding:12px}
  }

  /* ---------- hero ---------- */
  .hero{padding:70px 0 50px;text-align:center}
  .free-badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;
    color:#04210f;padding:7px 18px;border-radius:999px;background:linear-gradient(110deg,#22e6a8 20%,#b6ffe6 45%,#22e6a8 70%);background-size:220% 100%;
    animation:shine 2.6s linear infinite;box-shadow:0 0 24px rgba(34,230,168,.55)}
  @keyframes shine{to{background-position:-220% 0}}
  .free-badge b{display:inline-block;animation:pop 1.6s ease-in-out infinite}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.35) rotate(12deg)}}
  h1{font-size:clamp(36px,7vw,68px);line-height:1.05;letter-spacing:-1.5px;margin:22px 0 16px;font-weight:900}
  h1 .grad{background:linear-gradient(100deg,var(--cyan),var(--blue) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% 100%;animation:grad 5s ease-in-out infinite alternate;position:relative;display:inline-block}
  @keyframes grad{to{background-position:100% 0}}
  h1 .grad.glitch{animation:grad 5s ease-in-out infinite alternate,glitch .35s steps(2) 1}
  @keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-4px,1px);filter:hue-rotate(60deg)}50%{transform:translate(4px,-2px);filter:hue-rotate(-60deg)}100%{transform:translate(0)}}
  .lead{color:var(--muted);max-width:660px;margin:0 auto 30px;font-size:18px}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;border:0;cursor:pointer;
    padding:13px 26px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#6a5cff);box-shadow:0 8px 28px rgba(47,140,255,.4);transition:transform .2s,box-shadow .2s}
  .btn::before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
  @keyframes sweep{0%,55%{left:-80%}100%{left:140%}}
  .btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 36px rgba(47,140,255,.6)}
  .btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text)}
  .btn.ghost::before{display:none}
  .btn.ghost:hover{border-color:var(--cyan);box-shadow:0 0 22px rgba(39,224,255,.3)}
  .btn.coffee{background:var(--gold);color:#1b1500;box-shadow:0 8px 28px rgba(255,221,0,.28)}

  /* TV demo */
  .stage{position:relative;max-width:640px;margin:46px auto 0}
  .tv{position:relative;border-radius:18px;padding:12px;background:linear-gradient(145deg,#1b2a4d,#0b1224);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(47,140,255,.25)}
  .screen{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:
      radial-gradient(circle at 30% 30%,#2b4a8f 0,transparent 55%),radial-gradient(circle at 80% 80%,#5a2a7a 0,transparent 50%),#0a1022}
  .screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px);pointer-events:none}
  .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1);will-change:transform}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0,transparent 25%,transparent 55%,rgba(0,0,0,.72) 100%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
  .fx{position:absolute;inset:0;background:radial-gradient(circle at 80% 48%,rgba(255,150,40,.35),transparent 45%);opacity:0;animation:fx 3.4s ease-in-out infinite}
  @keyframes fx{0%,100%{opacity:0}8%{opacity:1}16%{opacity:.1}24%{opacity:.8}34%{opacity:0}}
  .ping{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 18px var(--cyan),inset 0 0 18px rgba(39,224,255,.4);
    transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none}
  .ping.go{animation:ping 1.6s ease-out}
  @keyframes ping{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
  .who{display:inline-block;font-size:clamp(9px,1.5vw,11px);font-weight:800;letter-spacing:1.5px;color:#04210f;background:var(--green);padding:2px 8px;border-radius:5px;margin-right:8px;vertical-align:1px}
  .scan{position:absolute;left:0;right:0;height:60px;background:linear-gradient(transparent,rgba(39,224,255,.16),transparent);animation:scan 4.5s linear infinite}
  @keyframes scan{from{top:-60px}to{top:100%}}
  .src{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(0,0,0,.5);padding:2px 10px;border-radius:999px;color:#dfe7ff;white-space:nowrap;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.85}
  .src i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-right:6px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.15}}
  .cap{position:absolute;left:6%;right:6%;bottom:11%;display:grid;justify-content:center;text-align:center}
  .cap .o,.cap .t{grid-area:1/1;font-size:clamp(12px,2.5vw,21px);line-height:1.35;padding:6px 14px;border-radius:8px;font-weight:700}
  .cap .o{color:#e6e6e6;background:rgba(0,0,0,.6)}
  .cap .t{position:relative;z-index:1;color:#fff;background:rgba(2,6,16,.96);box-shadow:0 0 0 1px rgba(39,224,255,.5),0 0 22px rgba(39,224,255,.35);transition:opacity .2s}
  .cap .t:empty{opacity:0}
  .cap .t.flash{animation:flash .5s}
  @keyframes flash{0%{filter:brightness(3);transform:scale(1.06)}100%{filter:none;transform:none}}
  .caret::after{content:"▌";margin-left:2px;animation:blink .8s infinite;color:var(--cyan)}
  .phone-float{position:absolute;right:-30px;bottom:-34px;width:112px;border-radius:26px;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 30px rgba(47,140,255,.5);animation:bob 4s ease-in-out infinite;border:1px solid var(--line)}
  .tv-float{position:absolute;left:-30px;top:-30px;width:92px;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 30px rgba(255,77,141,.4);animation:bob 4.6s ease-in-out infinite reverse;border:1px solid var(--line)}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  @media(max-width:700px){.phone-float{right:-6px;width:80px}.tv-float{left:-6px;top:-24px;width:66px}}

  /* ticker */
  .ticker{overflow:hidden;border-block:1px solid var(--line);background:rgba(16,26,48,.6);padding:12px 0;margin-top:56px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .track{display:flex;gap:46px;width:max-content;animation:tick 32s linear infinite}
  .track span{white-space:nowrap;font-weight:700;color:var(--muted);font-size:14.5px}
  .track span b{color:var(--cyan);margin-right:8px}
  @keyframes tick{to{transform:translateX(-50%)}}

  /* bölümler */
  .ver{display:inline-block;font-size:12px;font-weight:800;color:#cfe3ff;background:rgba(47,140,255,.18);border:1px solid rgba(47,140,255,.5);padding:1px 9px;border-radius:999px;margin-top:6px}
  .ver:empty{display:none}
  .whatsnew{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;position:relative;overflow:hidden}
  .whatsnew::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--cyan),var(--pink))}
  .wn-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;color:var(--muted);font-size:14px}
  .wn-head .ver{margin:0;font-size:14px}
  .newtag{font-size:11px;font-weight:900;letter-spacing:1.2px;color:#2b0016;background:var(--pink);padding:2px 9px;border-radius:999px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,141,.7)}50%{box-shadow:0 0 0 8px rgba(255,77,141,0)}}
  .whatsnew h3{font-size:20px;margin-bottom:8px}
  .whatsnew ul{margin:0 0 4px 20px;color:#c4cfee;font-size:15px}
  .whatsnew .note{color:#c4cfee;font-size:15px}
  .whatsnew details{margin:14px 0 0;background:transparent;border-radius:10px}
  .whatsnew summary{padding:10px 0;color:var(--cyan);font-size:14px}
  .hist{padding:0 0 6px;border-top:1px dashed var(--line);margin-top:6px}
  .hist .row{padding:12px 0;border-bottom:1px dashed var(--line)}
  .hist .row:last-child{border-bottom:0}
  .hist .row b{color:#fff;margin-right:8px}
  .hist .row span.d{color:var(--muted);font-size:13px}
  section{padding:70px 0}
  .eyebrow{color:var(--cyan);font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
  h2{font-size:clamp(26px,4.5vw,40px);letter-spacing:-.8px;margin:6px 0 8px}
  .sub{color:var(--muted);margin-bottom:34px;max-width:620px}

  .reveal{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* akış */
  .flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .node{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;text-align:center;min-width:150px;transition:.3s}
  .node:hover{transform:translateY(-6px);border-color:var(--cyan);box-shadow:0 0 30px rgba(39,224,255,.25)}
  .node .ic{font-size:36px;display:block;margin-bottom:4px}
  .node small{display:block;color:var(--muted);font-size:13px}
  .pipe{position:relative;width:70px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
  .pipe::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:pipe 1.5s linear infinite}
  .pipe.p2::after{animation-delay:.5s}
  @keyframes pipe{to{left:110%}}
  @media(max-width:700px){.pipe{width:4px;height:34px}.pipe::after{width:100%;height:40%;top:-40%;left:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);animation:pipev 1.5s linear infinite}
    @keyframes pipev{to{top:110%}}}

  /* kartlar (spotlight) */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
  .card{position:relative;background:var(--card);border-radius:20px;padding:28px;border:1px solid var(--line);overflow:hidden;transition:transform .25s,border-color .25s;
    --mx:50%;--my:50%}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(47,140,255,.28),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
  .card:hover::before{opacity:1}
  .card:hover{transform:translateY(-5px);border-color:rgba(39,224,255,.5)}
  .dl{display:flex;gap:18px;align-items:center;margin-bottom:14px}
  .dl img{width:84px;height:84px;border-radius:20px;box-shadow:0 0 26px rgba(47,140,255,.45);transition:transform .4s}
  .card:hover .dl img{transform:rotate(-6deg) scale(1.08)}
  .tag{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1.4px}
  .card h3{font-size:21px;line-height:1.2}
  .card p{color:var(--muted);font-size:15px;margin-bottom:20px}
  .card .btn{width:100%;justify-content:center}

  /* ücretsiz */
  .freebox{position:relative;border-radius:26px;padding:3px;background:conic-gradient(from var(--a,0deg),var(--green),var(--cyan),var(--blue),var(--pink),var(--green));animation:spin 6s linear infinite}
  @property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
  @keyframes spin{to{--a:360deg}}
  .freeinner{background:var(--bg2);border-radius:24px;padding:44px 28px;text-align:center}
  .zero{font-size:clamp(70px,16vw,140px);font-weight:900;line-height:1;background:linear-gradient(120deg,var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(34,230,168,.5))}
  .perks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .perk{background:rgba(34,230,168,.1);border:1px solid rgba(34,230,168,.4);color:#b9ffe9;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;animation:perk 3s ease-in-out infinite}
  .perk:nth-child(2){animation-delay:.4s}.perk:nth-child(3){animation-delay:.8s}.perk:nth-child(4){animation-delay:1.2s}
  @keyframes perk{0%,100%{box-shadow:0 0 0 rgba(34,230,168,0)}50%{box-shadow:0 0 20px rgba(34,230,168,.5)}}

  /* adımlar */
  ol.steps{list-style:none;counter-reset:s;position:relative;max-width:760px}
  ol.steps::before{content:"";position:absolute;left:25px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--cyan),var(--pink));opacity:.4}
  ol.steps li{counter-increment:s;position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px 18px 74px;margin-bottom:14px;transition:.3s}
  ol.steps li:hover{transform:translateX(8px);border-color:var(--cyan)}
  ol.steps li::before{content:counter(s);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;margin-left:5px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--cyan));font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(39,224,255,.6)}
  ol.steps b{display:block;font-size:17px}
  ol.steps span{color:var(--muted);font-size:15px}

  /* SSS */
  .faq{max-width:760px}
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .3s}
  details[open]{border-color:var(--cyan)}
  summary{cursor:pointer;font-weight:700;padding:16px 20px;list-style:none;display:flex;justify-content:space-between;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--cyan);font-size:22px;line-height:1;transition:transform .3s}
  details[open] summary::after{transform:rotate(135deg)}
  details p{color:var(--muted);padding:0 20px 18px;font-size:15px;animation:drop .35s}
  @keyframes drop{from{opacity:0;transform:translateY(-8px)}}

  /* destek */
  .support{text-align:center;max-width:860px;margin:0 auto}
  .support .cup{font-size:54px;display:inline-block;animation:steam 2.4s ease-in-out infinite}
  @keyframes steam{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
  .support p{color:var(--muted);margin:10px 0 22px}
  .support-name{font-weight:800;color:#eef7ff;margin:-8px 0 20px}
  .support-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px;text-align:left}
  .support-option{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .support-option h3{font-size:17px;margin-bottom:6px}.support-option p{font-size:14px;margin:0 0 14px}
  .contact{max-width:560px;margin:0 auto;text-align:center}
  .contact .qr-preview{text-align:left;max-width:390px;margin:16px auto 0}
  .contact .qr-preview img{width:145px;height:145px;flex-basis:145px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .support-select{width:100%;appearance:auto;background:#102d50;color:#eef7ff;border:1px solid rgba(84,184,255,.48);border-radius:12px;padding:12px 13px;font:inherit;font-weight:700;cursor:pointer}
  .qr-preview{display:flex;align-items:center;gap:18px;margin-top:16px;padding:14px;border:1px solid rgba(84,184,255,.28);border-radius:16px;background:rgba(6,18,38,.35);text-decoration:none}
  .qr-preview img{display:block;width:220px;height:220px;flex:0 0 220px;object-fit:contain;border-radius:12px;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.28)}
